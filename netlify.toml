[build]
  command = "npm run build"
  publish = ".next"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["streamers.json"]

# Route /api/live to the Netlify Function when deployed on Netlify
[[redirects]]
  from = "/api/live"
  to = "/.netlify/functions/live"
  status = 200
  force = true
